<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tarotmancer</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script
    src="https://app.rybbit.io/api/script.js"
    data-site-id="727"
    defer
></script>
</head>
<body>
    <canvas id="skyCanvas" class="sky-canvas" aria-hidden="true"></canvas>
    <main class="container">
        <header class="site-header">
            <h1><a class="wordmark" href="index.html">tarotmancer</a></h1>
        </header>

        <div id="controls" class="controls-area">
            <div class="spread-selector">
                <span class="control-label">Select spread:</span>
                <div class="spread-buttons">
                    <button class="spread-button active" data-spread="threeCard" aria-pressed="true">Three cards <span>03</span></button>
                    <button class="spread-button" data-spread="celticCross" aria-pressed="false">Celtic Cross <span>10</span></button>
                    <button class="spread-button" data-spread="horseshoe" aria-pressed="false">Horseshoe <span>07</span></button>
                </div>
            </div>
            <div class="action-buttons">
                <button id="dealButton" class="primary-button" disabled>Shuffle &amp; deal</button>
            </div>
        </div>

        <div class="reading-layout">
        <section id="spreadAreaWrapper" class="spread-area-wrapper" aria-labelledby="spreadTitle">
            <div class="table-heading"><h2 id="spreadTitle">3 Card Spread</h2><span id="spreadCount">78-card deck</span></div>
            <div id="spreadArea" class="spread-area">
                <canvas id="spreadCanvas" class="spread-canvas"></canvas>
            </div>
            <p id="sceneStatus" role="status"> </p>
            <details class="card-list"><summary>Cards in this reading</summary><ol id="cardList"></ol></details>
        </section>

        <aside class="output-area" aria-label="reading">
            <div id="stats-controls" class="tab-header">
                <button class="tab-button active" data-tab="interpretation">Interpretation</button>
                <button class="tab-button" data-tab="stats">Statistics</button>
            </div>
            <div class="tab-content">
                <div id="interpretationArea" class="interpretation-area">
                    <div id="interpretationText">Begin.</div>
                    <button id="interpretButton" disabled>Interpret</button>
                </div>
                <div id="statsArea" class="stats-area hidden">
                    <div id="statsText"></div>
                </div>
            </div>
        </aside>
        </div>
        <footer class="site-footer"><a href="privacy-policy.html">Privacy Policy</a></footer>

    </main>

    <!-- Card Zoom Modal -->
    <div id="cardModal" class="card-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalCardInfo">
        <button class="card-modal-close" id="modalClose" aria-label="Close card">&times;</button>
        <div class="card-modal-content" onclick="event.stopPropagation()">
            <p class="eyebrow" id="modalPosition"></p>
            <canvas id="modalCardCanvas" class="card-modal-canvas"></canvas>
            <p id="modalStatus" role="status"></p>
            <h2 id="modalCardInfo" class="card-modal-info"></h2>
            <p id="modalDescription" class="card-modal-description"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="tarot.js"></script>
    <noscript>Enable JavaScript to deal cards and request a reading.</noscript>
</body>
</html>
