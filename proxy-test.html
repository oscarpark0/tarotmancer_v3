<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Five9 Proxyfier — Test Console</title>
<link rel="icon" href="/favicon.ico" />
<style>
    :root {
        --bg: #0b0d12;
        --panel: #14171f;
        --panel-2: #1b1f2a;
        --border: #2a2f3d;
        --text: #e6e8ee;
        --muted: #8a93a6;
        --accent: #7c5cff;
        --accent-2: #4cc9f0;
        --ok: #25c277;
        --err: #ff5577;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(1200px 800px at 80% -10%, #1a1240 0%, var(--bg) 60%);
        color: var(--text);
    }
    header {
        padding: 24px 32px 8px;
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
    header .sub { color: var(--muted); font-size: 13px; }
    main {
        display: grid;
        grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
        gap: 16px;
        padding: 16px 32px 32px;
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 520px;
    }
    .panel h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-2);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .panel .body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select, textarea {
        width: 100%;
        background: #0f121a;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font: 13px var(--mono);
        outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 140px; }
    .row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    button {
        background: linear-gradient(180deg, var(--accent), #5b3df0);
        color: white;
        border: 0;
        padding: 11px 16px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
    }
    button.ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        font-weight: 500;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
        font: 11px var(--mono);
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
    }
    .status-ok { color: var(--ok); border-color: rgba(37,194,119,.4); }
    .status-err { color: var(--err); border-color: rgba(255,85,119,.4); }
    pre {
        margin: 0;
        flex: 1;
        background: #0a0d14;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
        font: 12.5px/1.5 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 120px;
    }
    details { background: #0f121a; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
    details > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    .kbd { font: 11px var(--mono); background: #0f121a; border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; color: var(--muted); }
    a { color: var(--accent-2); }
</style>
</head>
<body>
<header>
    <h1>Five9 Proxyfier — Test Console</h1>
    <span class="sub">Mutual-auth proxy via <span class="kbd">/api/proxy</span></span>
</header>
<main>
    <section class="panel">
        <h2>Request</h2>
        <div class="body">
            <div class="row-3">
                <div>
                    <label for="method">Method</label>
                    <select id="method">
                        <option>GET</option>
                        <option>POST</option>
                        <option>PUT</option>
                        <option>PATCH</option>
                        <option>DELETE</option>
                        <option>OPTIONS</option>
                    </select>
                </div>
                <div>
                    <label for="contentType">Content-Type</label>
                    <select id="contentType">
                        <option value="application/json">application/json</option>
                        <option value="application/x-www-form-urlencoded">application/x-www-form-urlencoded</option>
                    </select>
                </div>
                <div>
                    <label for="retryCount">Retries (0–5)</label>
                    <input id="retryCount" type="number" min="0" max="5" value="3" />
                </div>
            </div>

            <div>
                <label for="url">Upstream URL <span class="pill">supports {{vars}}</span></label>
                <input id="url" placeholder="https://example.com/api/{{path}}" />
            </div>

            <div>
                <label for="mutualAuthProxyPath">Mutual-auth proxy path <span class="pill">optional</span></label>
                <input id="mutualAuthProxyPath" placeholder="e.g. mtls-target-path (leave blank to skip)" />
            </div>

            <div>
                <label for="headers">Headers (JSON object)</label>
                <textarea id="headers" spellcheck="false">{
  "Accept": "application/json"
}</textarea>
            </div>

            <div class="row-3">
                <div style="grid-column: span 3;">
                    <label for="params">Query params (JSON object)</label>
                    <textarea id="params" spellcheck="false">{}</textarea>
                </div>
            </div>

            <div>
                <label for="urlData">urlData — values for {{vars}} (JSON object)</label>
                <textarea id="urlData" spellcheck="false">{}</textarea>
            </div>

            <div>
                <label for="data">Body data (JSON object — used for non-GET)</label>
                <textarea id="data" spellcheck="false">{}</textarea>
            </div>

            <div>
                <label for="metadata">Metadata (echoed back, JSON object)</label>
                <textarea id="metadata" spellcheck="false">{ "test": "tarotmancer.com" }</textarea>
            </div>

            <div class="actions">
                <button id="send">Send via Proxyfier</button>
                <button class="ghost" id="loadSample">Load sample</button>
                <button class="ghost" id="clear">Clear</button>
            </div>
        </div>
    </section>

    <section class="panel">
        <h2>
            Response
            <span id="statusPill" class="pill">idle</span>
            <span id="latencyPill" class="pill" style="display:none"></span>
            <span id="tracePill" class="pill" style="display:none"></span>
        </h2>
        <div class="body">
            <details>
                <summary>Outgoing payload</summary>
                <pre id="outgoing">—</pre>
            </details>
            <label>Upstream response body</label>
            <pre id="responseBody">—</pre>
            <details>
                <summary>Full Proxyfier envelope (status, headers, attempts, metadata)</summary>
                <pre id="responseEnvelope">—</pre>
            </details>
        </div>
    </section>
</main>

<script>
function parseJsonField(id, fallback) {
    const raw = document.getElementById(id).value.trim();
    if (!raw) return fallback;
    try { return JSON.parse(raw); }
    catch (e) { throw new Error(`Invalid JSON in "${id}": ${e.message}`); }
}

function setStatus(text, kind) {
    const el = document.getElementById('statusPill');
    el.textContent = text;
    el.className = 'pill' + (kind === 'ok' ? ' status-ok' : kind === 'err' ? ' status-err' : '');
}

document.getElementById('loadSample').addEventListener('click', () => {
    document.getElementById('method').value = 'GET';
    document.getElementById('url').value = 'https://httpbin.org/anything/{{slug}}';
    document.getElementById('urlData').value = JSON.stringify({ slug: 'tarotmancer-test' }, null, 2);
    document.getElementById('params').value = JSON.stringify({ hello: 'world' }, null, 2);
    document.getElementById('headers').value = JSON.stringify({ Accept: 'application/json' }, null, 2);
    document.getElementById('data').value = '{}';
    document.getElementById('mutualAuthProxyPath').value = '';
});

document.getElementById('clear').addEventListener('click', () => {
    document.getElementById('responseBody').textContent = '—';
    document.getElementById('responseEnvelope').textContent = '—';
    document.getElementById('outgoing').textContent = '—';
    setStatus('idle');
    document.getElementById('latencyPill').style.display = 'none';
    document.getElementById('tracePill').style.display = 'none';
});

document.getElementById('send').addEventListener('click', async () => {
    const btn = document.getElementById('send');
    btn.disabled = true;
    setStatus('sending…');

    try {
        const method = document.getElementById('method').value;
        const url = document.getElementById('url').value.trim();
        if (!url) throw new Error('URL is required.');

        const payload = {
            url,
            method,
            contentType: document.getElementById('contentType').value,
            retryCount: Number(document.getElementById('retryCount').value) || 0,
            headers: parseJsonField('headers', {}),
            params: parseJsonField('params', {}),
            urlData: parseJsonField('urlData', {}),
            data: parseJsonField('data', {}),
            metadata: parseJsonField('metadata', {}),
        };
        const map = document.getElementById('mutualAuthProxyPath').value.trim();
        if (map) payload.mutualAuthProxyPath = map;

        document.getElementById('outgoing').textContent = JSON.stringify(payload, null, 2);

        const t0 = performance.now();
        const res = await fetch('/api/proxy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const t1 = performance.now();

        const text = await res.text();
        let envelope = null;
        try { envelope = JSON.parse(text); } catch (_) {}

        const lat = document.getElementById('latencyPill');
        lat.textContent = `${Math.round(t1 - t0)} ms`;
        lat.style.display = '';

        if (envelope && envelope.traceId) {
            const tp = document.getElementById('tracePill');
            tp.textContent = `trace ${envelope.traceId}`;
            tp.style.display = '';
        }

        if (!res.ok) {
            setStatus(`gateway ${res.status}`, 'err');
            document.getElementById('responseBody').textContent = text;
            document.getElementById('responseEnvelope').textContent = envelope ? JSON.stringify(envelope, null, 2) : text;
            return;
        }

        if (envelope && typeof envelope.requestResponseStatusCode === 'number') {
            const upstream = envelope.requestResponseStatusCode;
            setStatus(`upstream ${upstream}`, upstream >= 200 && upstream < 400 ? 'ok' : 'err');
            const body = envelope.requestResponseBody;
            document.getElementById('responseBody').textContent =
                typeof body === 'string' ? body : JSON.stringify(body, null, 2);
            document.getElementById('responseEnvelope').textContent = JSON.stringify(envelope, null, 2);
        } else {
            setStatus(`ok ${res.status}`, 'ok');
            document.getElementById('responseBody').textContent = text;
            document.getElementById('responseEnvelope').textContent = envelope ? JSON.stringify(envelope, null, 2) : '—';
        }
    } catch (err) {
        setStatus('error', 'err');
        document.getElementById('responseBody').textContent = String(err && err.message || err);
    } finally {
        btn.disabled = false;
    }
});
</script>
</body>
</html>
